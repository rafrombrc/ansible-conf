---
# handlers file for immich
- name: Restart immich systemd service
  ansible.builtin.systemd_service:
    name: immich.service
    state: restarted
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podsuid }}"

- name: Restart pg-backup-immich systemd timer
  ansible.builtin.systemd_service:
    name: pg-backup-immich.timer
    state: restarted
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podsuid }}"
