---
- name: Get pods user uid
  ansible.builtin.getent:
    database: passwd
    key: pods

- name: Store pods uid for later use
  ansible.builtin.set_fact:
    podsuid: "{{ ansible_facts['getent_passwd']['pods'][1] }}"

- name: Store pods gid for later user
  ansible.builtin.set_fact:
    podsgid: "{{ ansible_facts['getent_passwd']['pods'][2] }}"
