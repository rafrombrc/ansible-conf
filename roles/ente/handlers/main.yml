---
# handlers file for ente
- name: Restart ente systemd service
  ansible.builtin.systemd_service:
    name: my-ente.service
    state: restarted
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podsuid }}"

- name: Restart pg_backup-ente systemd timer
  ansible.builtin.systemd_service:
    name: pg-backup-ente.timer
    state: restarted
    scope: user
  environment:
    XDG_RUNTIME_DIR: "run/user/{{ podsuid }}"
